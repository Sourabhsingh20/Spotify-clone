<!DOCTYPE html>
<html lang="en">
<head>

     <link rel="icon" href="./assets/logo.png">
    <link rel="stylesheet" href="SignUpPage.css">

    <header><img class="logo" src=".assets/logo.png" alt="spotyfyy"></header>

        <div class="heading">
            <h1>Sign up to start listening </h1>
        </div>
        
        <div class="lableinp">
                <label for="emailBox">Email address</label>
        </div>
        <div >
            <input id="emailBox" placeholder="name@domain.com">

       <div class="loginFeature login">
          <button class="logNextBtn">Next</button>
        </div>
        <div>
            <p class="or">or</p>
        </div>
        <div class="loginOption">
            <button><i class="fa-solid fa-mobile-screen-button loginOptionBtn" ></i> Sign up with phone number</button>
            <button><i class="fa-brands fa-google loginOptionBtn"></i>Sign up with google</button>
            <button> <i class="fa-brands fa-apple loginOptionBtn"></i>Sign up with apple</button>
        </div>
        <div class="haveaccount">
            <p class="or">Already have an account?</p>
            <button class="ifAccThenLogin">Log in</button>
          </div>
        
    </div>
